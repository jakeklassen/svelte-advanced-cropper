name: CI

# Pull requests run this directly. Pushes to main run it through release.yml, which
# calls it and publishes only after it passes.
on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the run; runs called by release.yml finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes; fail fast if a download stalls.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the node and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Vitest browser mode and Playwright both run in real Chromium.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:svelte
      - run: pnpm check
      - run: pnpm test:unit --run

      # Builds the site (failing on broken internal links) and packages the library.
      - run: pnpm build
        env:
          STRICT_LINKS: '1'

      - run: pnpm test:e2e
