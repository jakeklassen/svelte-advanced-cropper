name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # mise reads ./mise.toml and installs the pinned node + pnpm. `cache: true`
      # caches the installed tools between runs.
      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser-mode tests run in real Chromium via Playwright; the binary and
      # its system libs aren't on the runner by default.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build
